name: act practice
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/act.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  act:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: act v0.2.97 설치
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.2.97 -R nektos/act -p "act_Linux_x86_64.tar.gz" -O act.tar.gz
          tar xzf act.tar.gz act
          ./act --version
      - name: act -l (실행될 job 목록)
        run: ./act -l
      - name: 1) 그대로 실행 -> 초록이어야 함
        run: |
          ./act pull_request -j test --matrix python-version:3.12 \
            -P ubuntu-latest=catthehacker/ubuntu:act-latest \
            --artifact-server-path /tmp/artifacts
      - name: 2) 테스트를 일부러 깨뜨리고 실행 -> 빨강이어야 함
        run: |
          sed -i 's/hello hackathon/hello broken/' tests/test_main.py
          if ./act pull_request -j test --matrix python-version:3.12 \
            -P ubuntu-latest=catthehacker/ubuntu:act-latest \
            --artifact-server-path /tmp/artifacts; then
            echo "기대와 다름: 깨뜨렸는데 통과함"
            exit 1
          fi
          echo "act 에서도 빨간 결과 확인"
      - name: 3) 원래 코드로 복구
        run: |
          git checkout -- tests/test_main.py
          git status --short
