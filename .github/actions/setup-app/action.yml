name: setup-app
description: Python 설치와 개발 패키지 설치를 한 번에 한다
inputs:
  python-version:
    description: 설치할 Python 버전
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements*.txt
    - run: pip install -r requirements-dev.txt
      shell: bash
